apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    kubernetes.io/metadata.name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: commercelab-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - api-gateway.commercelab-retail.svc.cluster.local:8080
              - catalog-pricing-service.commercelab-retail.svc.cluster.local:8081
              - inventory-warehouse-service.commercelab-retail.svc.cluster.local:8082
              - order-checkout-service.commercelab-retail.svc.cluster.local:8083
              - payment-service.commercelab-retail.svc.cluster.local:8084
              - fulfillment-shipping-service.commercelab-retail.svc.cluster.local:8085
              - ledger-reconciliation-service.commercelab-retail.svc.cluster.local:8086
              - iam-auth-service.commercelab-retail.svc.cluster.local:8087
              - backoffice-support-service.commercelab-retail.svc.cluster.local:8088
              - notification-service.commercelab-retail.svc.cluster.local:8089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
