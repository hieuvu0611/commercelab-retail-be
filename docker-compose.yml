# Quy chuẩn giới hạn tài nguyên tối thiểu cho toàn bộ dự án (Benchmarking Low-Resource Cap)
# Mỗi container bị khóa cứng ở tầng Linux cgroup: Tối đa 250MB RAM (không cho phép swap) và 0.25 CPU core.
x-low-resource-limits: &low-resource-limits
  cpus: 0.25
  mem_limit: 250m
  memswap_limit: 250m
  deploy:
    resources:
      limits:
        cpus: '0.25'
        memory: 250M
      reservations:
        cpus: '0.05'
        memory: 32M

# Shared settings for the Go services (see each service's `environment` for what it actually reads).
x-go-env: &go-env
  GOMAXPROCS: "1"
  GOMEMLIMIT: "220MiB"

# JWT signing secrets come from the environment or a local .env file (see .env.example). They are mandatory:
# a service that needs them exits with a clear message when they are missing or shorter than 32 bytes.
x-jwt-env: &jwt-env
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}

x-store-env: &store-env
  MONGO_URI: mongodb://mongo_admin:mongo_password@mongodb:27017/commerce_lab_doc?authSource=admin
  MONGO_DATABASE: commerce_lab_doc
  REDIS_ADDR: redis:6379

# Every app service waits for healthy infrastructure before it starts.
x-infra-healthy: &infra-healthy
  postgres:
    condition: service_healthy
  mongodb:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ============================================================================
  # 1. TẦNG INFRASTRUCTURE (Mỗi container <= 250MB RAM & <= 0.25 CPU)
  # ============================================================================
  postgres:
    <<: *low-resource-limits
    image: postgres:16-alpine
    restart: unless-stopped
    # Tinh chỉnh bộ nhớ nội bộ của PostgreSQL để chạy mượt trong trần 250MB RAM mà không bị OOM-killer
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=16MB"
      - "-c"
      - "max_connections=60"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: commerce_lab
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    <<: *low-resource-limits
    # Exception to the 250 MB cap: MongoDB 7 needs a WiredTiger cache of at least 0.25 GB, and the image's
    # own start-up mongosh needs more on top. At 250-400 MB the kernel OOM-kills that mongosh, the entrypoint
    # aborts and the container restarts, so the stack is intermittently unhealthy.
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 32M
    image: mongo:7.0
    restart: unless-stopped
    # MongoDB 7 rejects a WiredTiger cache below 0.25 GB; 0.25 is the smallest value that starts.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: commerce_lab_doc
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo-indexes.js:/docker-entrypoint-initdb.d/01-init-indexes.js:ro
    healthcheck:
      # Plain TCP probe on the container IP. mongosh is a Node.js process; started repeatedly inside the
      # capped container it gets OOM-killed. While init scripts run, mongod only listens on 127.0.0.1,
      # so this check passes only once the real server is up.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$$(hostname -i)/27017'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    <<: *low-resource-limits
    image: redis:7.2-alpine
    restart: unless-stopped
    # Giới hạn maxmemory 180MB để tổng RSS container không bao giờ vượt 250MB
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "180mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    <<: *low-resource-limits
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.4
    restart: unless-stopped
    # Khóa Seastar engine ở 1 luồng (--smp 1) và 200MB RAM (--memory 200M) để khớp trần 250MB container
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 200M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_KAFKA_HOST_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_HOST_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # ============================================================================
  # 2. TẦNG 10 MICROSERVICES (Mỗi service <= 250MB RAM & <= 0.25 CPU)
  # Bật toàn bộ bằng: docker compose --profile app up -d --build
  # ============================================================================
  api-gateway:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    environment:
      <<: [*go-env, *jwt-env]
      API_GATEWAY_PORT: "8080"
      REDIS_ADDR: redis:6379
      IAM_SERVICE_URL: http://iam-auth-service:8087
      CATALOG_SERVICE_URL: http://catalog-pricing-service:8081
      INVENTORY_SERVICE_URL: http://inventory-warehouse-service:8082
      ORDER_SERVICE_URL: http://order-checkout-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      FULFILLMENT_SERVICE_URL: http://fulfillment-shipping-service:8085
      LEDGER_SERVICE_URL: http://ledger-reconciliation-service:8086
      BACKOFFICE_SERVICE_URL: http://backoffice-support-service:8088
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      iam-auth-service:
        condition: service_healthy
      catalog-pricing-service:
        condition: service_healthy
      inventory-warehouse-service:
        condition: service_healthy
      order-checkout-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      fulfillment-shipping-service:
        condition: service_healthy
      ledger-reconciliation-service:
        condition: service_healthy
      backoffice-support-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-pricing-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: catalog-pricing-service
    environment:
      <<: [*go-env, *store-env]
      CATALOG_PRICING_PORT: 8081
      DATABASE_URL_PRICING: postgres://pricing_svc_user:pricing_secret@postgres:5432/commerce_lab?sslmode=disable&search_path=pricing
      MIGRATE_ON_START: "true"
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-warehouse-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-warehouse-service
    environment:
      <<: [*go-env, *jwt-env]
      INVENTORY_WAREHOUSE_PORT: 8082
      DATABASE_URL_INVENTORY: postgres://inventory_svc_user:inventory_secret@postgres:5432/commerce_lab?sslmode=disable&search_path=inventory
      MIGRATE_ON_START: "true"
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-checkout-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-checkout-service
    environment:
      <<: *go-env
      ORDER_CHECKOUT_PORT: 8083
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    environment:
      <<: *go-env
      PAYMENT_PORT: 8084
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  fulfillment-shipping-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: fulfillment-shipping-service
    environment:
      <<: *go-env
      FULFILLMENT_SHIPPING_PORT: 8085
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-reconciliation-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ledger-reconciliation-service
    environment:
      <<: *go-env
      LEDGER_RECONCILIATION_PORT: 8086
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam-auth-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: iam-auth-service
    environment:
      <<: [*go-env, *jwt-env]
      IAM_AUTH_PORT: 8087
      DATABASE_URL_IAM: postgres://iam_svc_user:iam_secret@postgres:5432/commerce_lab?sslmode=disable&search_path=iam
      MIGRATE_ON_START: "true"
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backoffice-support-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: ./services/backoffice-support-service
      dockerfile: Dockerfile
    environment:
      NODE_OPTIONS: "--max-old-space-size=180"
      UV_THREADPOOL_SIZE: "2"
      BACKOFFICE_SUPPORT_PORT: "8088"
    ports:
      - "${BACKOFFICE_SUPPORT_HOST_PORT:-8088}:8088"
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    <<: *low-resource-limits
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      <<: *go-env
      NOTIFICATION_PORT: 8089
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-8089}:8089"
    depends_on: *infra-healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  redpanda_data:
