apiVersion: v1
kind: ResourceQuota
metadata:
  name: commercelab-quota
  namespace: commercelab-retail
spec:
  hard:
    pods: "30"
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: commercelab-limits
  namespace: commercelab-retail
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 250Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 25m
        memory: 32Mi
